[project]
name = "transformer-based-adaptive-line-enhancer"
version = "0.1.0"
description = "Python implementations of adaptive line-enhancement methods"
readme = "README.md"
authors = [
    { name = "Strik0r", email = "strik0rium@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
